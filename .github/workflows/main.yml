name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Decode Debug Keystore
      run: base64 --decode debug.keystore.base64 > debug.keystore
        
    - name: Build APK with Gradle
      run: gradle clean assembleDebug -Dorg.gradle.jvmargs="-Xmx3g" --no-daemon
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
